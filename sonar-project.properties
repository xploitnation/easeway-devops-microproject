# SonarQube Project Configuration
sonar.projectKey=easeway
sonar.projectName=Easeway Student Mental Wellness Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=.
sonar.inclusions=server.js,db.js,config.js,seed.js,public/app.js

# Exclusions
sonar.exclusions=node_modules/**,data/**,terraform/**,ansible/**,monitoring/**,test.js,coverage/**

# Tests configuration
sonar.tests=.
sonar.test.inclusions=test.js

# Encoding
sonar.sourceEncoding=UTF-8
