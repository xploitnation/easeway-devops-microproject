version: '3.8'

services:
  easeway-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: easeway:latest
    container_name: easeway-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - easeway-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/me', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  easeway-data:
    driver: local
