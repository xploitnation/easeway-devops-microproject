global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape EC2 Host system metrics (CPU, RAM, Disk, Network) via Node Exporter
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Scrape Easeway application endpoint
  - job_name: 'easeway_app'
    metrics_path: '/api/me'
    scrape_interval: 10s
    static_configs:
      - targets: ['easeway-app:3000']
