---
# Ansible Playbook: Bootstrap Docker, Jenkins & Deploy Easeway Application
# Usage: ansible-playbook -i inventory.ini playbook.yml
- name: Configure DevSecOps Environment and Deploy Easeway
  hosts: easeway_servers
  become: true

  vars:
    app_dir: /opt/easeway
    repo_url: https://github.com/YOUR_GITHUB_USERNAME/easeway.git
    app_port: 3000

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - openjdk-17-jre
        state: present

    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: true

    - name: Create application deployment directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create persistent data directory for SQLite and encryption keys
      file:
        path: "{{ app_dir }}/data"
        state: directory
        owner: 1000
        group: 1000
        mode: '0700'

    - name: Deploy application container using Docker
      community.docker.docker_container:
        name: easeway-app
        image: easeway:latest
        pull: false
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:{{ app_port }}"
        volumes:
          - "{{ app_dir }}/data:/app/data"
      ignore_errors: true

    - name: Print deployment confirmation
      debug:
        msg: "Easeway deployed successfully! Access at http://{{ ansible_host }}:{{ app_port }}"
